[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiffin-service"
version = "1.0.0"
description = "Tiffin Service Management, Pause/Resume Lifecycle, and Pro-Rated Billing System"
readme = "README.md"
authors = [
    { name = "Sachin Choudhary", email = "amisachinchoudhary@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
tiffin = "tiffin.cli:main"
