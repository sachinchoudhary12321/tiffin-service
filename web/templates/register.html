{% extends "base.html" %}

{% block title %}Register - Annapurna Tiffin{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
  <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
    <div class="text-center space-y-2">
      <span class="text-4xl">👨‍🍳</span>
      <h2 class="text-2xl font-black text-slate-900">Create Owner Account</h2>
      <p class="text-xs text-slate-500">Register a new tiffin kitchen manager profile</p>
    </div>

    <form method="POST" action="{{ url_for('register_view') }}" class="space-y-4 text-xs">
      <div>
        <label class="font-bold text-slate-700 block mb-1">Username</label>
        <input type="text" name="username" required placeholder="kitchen_boss" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">Email Address</label>
        <input type="email" name="email" placeholder="owner@tiffin.com" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">Password</label>
        <input type="password" name="password" required placeholder="Minimum 4 characters" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow transition text-sm">
        Register Account
      </button>
    </form>

    <p class="text-center text-xs text-slate-500">
      Already have an account? <a href="{{ url_for('login_view') }}" class="text-amber-600 font-bold hover:underline">Sign in here</a>
    </p>
  </div>
</div>
{% endblock %}
