{% extends "base.html" %}

{% block title %}Login - Annapurna Tiffin{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
  <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
    <div class="text-center space-y-2">
      <span class="text-4xl">🔐</span>
      <h2 class="text-2xl font-black text-slate-900">Owner Login</h2>
      <p class="text-xs text-slate-500">Access dispatch controls and customer billing</p>
    </div>

    <!-- Demo Credentials Notice -->
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900">
      <p class="font-bold mb-0.5"><i class="fa-solid fa-key mr-1 text-amber-600"></i> Default Demo Credentials:</p>
      <p>Username: <code class="bg-amber-100 px-1.5 py-0.5 rounded font-mono font-bold">admin</code> | Password: <code class="bg-amber-100 px-1.5 py-0.5 rounded font-mono font-bold">admin123</code></p>
    </div>

    <form method="POST" action="{{ url_for('login_view', next=request.args.get('next')) }}" class="space-y-4 text-xs">
      <div>
        <label class="font-bold text-slate-700 block mb-1">Username</label>
        <input type="text" name="username" required placeholder="admin" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <div>
        <label class="font-bold text-slate-700 block mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow transition text-sm">
        Sign In
      </button>
    </form>

    <p class="text-center text-xs text-slate-500">
      Don't have an account? <a href="{{ url_for('register_view') }}" class="text-amber-600 font-bold hover:underline">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
